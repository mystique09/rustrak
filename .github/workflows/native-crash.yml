name: Native crash verification

on:
  push:
    branches: [codex/native-crash-symbols, codex/rustrak-integration]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  native:
    if: github.repository == 'mystique09/rustrak'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2022, macos-15, macos-15-intel]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 40
    env:
      CARGO_PROFILE_DEV_DEBUG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: '1.98'
          components: rustfmt, clippy
          cache-workspaces: |
            apps/server
            tests/native-smoke
      - run: cargo test --locked --features native --lib --test native_crash_test --test project_import_test
        working-directory: apps/server
      - run: cargo clippy --locked --features native --lib --bin rustrak -- -D warnings
        working-directory: apps/server
      - run: cargo build --locked --features native --bin rustrak
        working-directory: apps/server
      - run: cargo build --locked
        working-directory: tests/native-smoke
        env:
          CARGO_PROFILE_DEV_DEBUG: '2'
      - name: Install pinned Sentry CLI
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          New-Item -ItemType Directory -Force -Path .qa | Out-Null
          if ($IsWindows) { $asset = 'sentry-cli-Windows-x86_64.exe' }
          elseif ($IsMacOS) { $asset = 'sentry-cli-Darwin-universal' }
          else { $asset = 'sentry-cli-Linux-x86_64' }
          gh release download 3.8.0 --repo getsentry/sentry-cli --pattern $asset --dir .qa
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if (-not $IsWindows) { chmod +x ".qa/$asset" }
          "NATIVE_CLI=.qa/$asset" | Out-File -FilePath $env:GITHUB_ENV -Append
      - name: Capture and resolve a native crash
        shell: pwsh
        run: |
          $suffix = if ($IsWindows) { '.exe' } else { '' }
          python scripts/verify-native.py --server "apps/server/target/debug/rustrak$suffix" --client "tests/native-smoke/target/debug/rustrak-native-smoke$suffix" --sentry-cli $env:NATIVE_CLI --output .qa/smoke --project-manifest tests/fixtures/idate-projects.json
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          Get-Content .qa/smoke/native-summary.json | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append
  postgres:
    if: github.repository == 'mystique09/rustrak'
    runs-on: ubuntu-24.04
    timeout-minutes: 35
    env:
      CARGO_PROFILE_DEV_DEBUG: '1'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: actions-rust-lang/setup-rust-toolchain@ecabd13d1c56bd1345c230e542e9144811ad706f
        with:
          toolchain: '1.98'
          cache-workspaces: apps/server
      - run: cargo test --locked --no-default-features --features postgres,native --test native_crash_test --test project_import_test
        working-directory: apps/server
