name: Native staging image

on:
  push:
    branches: [codex/rustrak-integration]
    paths:
      - apps/server/**
      - apps/dashboard/**
      - packages/client/**
      - scripts/verify-native-container.py
      - tests/fixtures/idate-projects.json
      - pnpm-lock.yaml
      - .github/workflows/native-image.yml
  workflow_dispatch:
    inputs:
      publish:
        description: Publish the verified image to this fork's GHCR package
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: native-staging-image-${{ github.ref }}
  cancel-in-progress: false

jobs:
  image:
    if: github.repository == 'mystique09/rustrak'
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020
        with:
          node-version: 24
      - run: pnpm install --frozen-lockfile
      - name: Bundle dashboard
        run: |
          pnpm turbo run build --filter=@rustrak/dashboard
          bash scripts/bundle-dashboard.sh
          test -s apps/server/static/index.html
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069
      - name: Build native PostgreSQL image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc
        with:
          context: ./apps/server
          file: ./apps/server/Dockerfile
          platforms: linux/amd64
          build-args: FEATURES=postgres,native
          load: true
          push: false
          cache-from: type=gha,scope=native-staging
          cache-to: type=gha,mode=max,scope=native-staging
          tags: rustrak-native:verify
          labels: |
            org.opencontainers.image.source=https://github.com/mystique09/rustrak
            org.opencontainers.image.revision=${{ github.sha }}
      - name: Verify dashboard, imported DSNs, native symbols and restart
        run: python3 scripts/verify-native-container.py --image rustrak-native:verify
      - name: Log in to fork registry
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish tested image and record digest
        if: github.event_name == 'workflow_dispatch' && inputs.publish
        env:
          IMAGE: ghcr.io/mystique09/rustrak-native:sha-${{ github.sha }}
        run: |
          docker tag rustrak-native:verify "$IMAGE"
          docker push "$IMAGE"
          docker image inspect "$IMAGE" --format '{{range .RepoDigests}}{{println .}}{{end}}' >> "$GITHUB_STEP_SUMMARY"
