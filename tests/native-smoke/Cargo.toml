[package]
name = "rustrak-native-smoke"
version = "0.1.0"
edition = "2021"
publish = false

[dependencies]
sentry = { version = "=0.49.3", default-features = false, features = ["backtrace", "contexts", "panic", "reqwest", "rustls"] }
sentry-minidump = "=0.49.3"

[profile.dev]
debug = 2

[profile.release]
debug = 2
strip = false
